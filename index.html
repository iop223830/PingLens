    function memberFeature(){return {kind:'member',title:'PingLens 会员',desc:'解锁专属训练计划、阶段报告和赛事洞察，让每一次训练都有连续的成长记录。',cta:'确认开通会员',done:'会员权益已解锁'}}
    function memberFeatureBody(f){return `<article class="feature-hero"><span class="pill">限时体验 · 会员专属</span><h2>把训练、赛事与成长<br>连成一条线</h2><p>会员可查看连续训练趋势、定制计划与重点回合复盘。</p></article><div class="feature-section"><div class="feature-section-head"><h2>已解锁权益</h2><span>会员服务</span></div><div class="feature-list"><div class="feature-item"><span><b>专属训练计划</b><small>根据赛事洞察生成阶段任务与验证训练</small></span><span class="state">已包含</span></div><div class="feature-item"><span><b>深度成长报告</b><small>查看个人基线、趋势与阶段性建议</small></span><span class="state">已包含</span></div><div class="feature-item"><span><b>重点回合复盘</b><small>标记训练片段，沉淀教练批注</small></span><span class="state">已包含</span></div></div></div><div class="feature-section"><div class="feature-section-head"><h2>选择方案</h2><span>可随时调整</span></div><div class="feature-form"><label>会员方案<select aria-label="会员方案"><option>月度会员 · ¥29 / 月</option><option>季度会员 · ¥79 / 季</option><option>年度会员 · ¥249 / 年</option></select></label></div></div>${featureAction(f)}`}
    function featureScreen(){const f=state.feature==='PingLens 会员权益'?memberFeature():featureInfo(state.feature);const body=f.kind==='member'?memberFeatureBody(f):featureBody(f);return `<section class="screen feature-screen"><div class="feature-head"><button class="circle-btn" data-action="close-feature" aria-label="返回">‹</button><div><p class="feature-kicker">PINGLENS 功能中心</p><h1>${f.title}</h1></div></div><p class="feature-intro">${f.desc}</p>${state.featureDone?'<div class="feature-done"><i>✓</i>本次操作已完成，可返回继续浏览。</div>':''}${body}</section>`}
    function openFeature(message){state.feature=message;state.featureBack=state.page;state.featureDone=false;state.featureReturnReport=state.report;state.report=false;state.page='feature';render()}
    function loginScreen(){return `<section class="login-screen"><div class="login-brand"><span class="brand-mark"><img src="assets/pinglens-logo.jpg" alt="PingLens" /></span></div><p class="login-tag">乒乓赛训一体 · 训练与赛事数据助手</p><div class="login-hero"><h1>欢迎回来，<br>继续下一场进步。</h1><p>登录后查看你的训练计划、赛事日历和成长报告。</p></div><div class="login-card"><label>账号<input value="徐金霞" aria-label="账号"></label><label>密码<input type="password" placeholder="请输入密码" aria-label="密码"></label><button class="primary wide" data-action="login">登录并进入</button><div class="login-note"><i>i</i><span>当前为网页演示登录。真实账号、密码与数据授权需接入服务端后启用。</span></div></div></section>`}
    function render(){if(!state.loggedIn){view.innerHTML=loginScreen();nav.innerHTML='';return}let html;if(state.page==='search')html=searchScreen();else if(state.page==='feature')html=featureScreen();else if(state.page==='match')html=match();else if(state.role==='教练端')html=coachScreen();else if(state.role==='场馆赛事端')html=venueScreen();else html=state.page==='home'?home():state.page==='train'?train():state.page==='event'?event():state.page==='growth'?growth():studentMine();view.innerHTML=html.replaceAll('林昊','徐金霞').replaceAll('>林<','>徐<');if(state.page==='search')nav.innerHTML='';else navRender();const captureVideo=view.querySelector('.camera-video');if(captureVideo)captureVideo.play().catch(()=>{});const searchInput=view.querySelector('[data-search-input]');if(searchInput)setTimeout(()=>searchInput.focus(),0);}
    document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.role){e.stopImmediatePropagation();setRole(t.dataset.role);return}if(t.dataset.action==='role-switch'){e.stopImmediatePropagation();roleSheet();return}if(t.dataset.action==='exit-match'&&state.role==='场馆赛事端'){e.stopImmediatePropagation();state.page='venue-score';render()}},true);
    document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.searchTerm){e.preventDefault();e.stopImmediatePropagation();state.searchQuery=t.dataset.searchTerm;const input=view.querySelector('[data-search-input]');if(input)input.value=state.searchQuery;const clear=view.querySelector('.search-clear');if(clear)clear.style.visibility='visible';updateSearchContent();return}const a=t.dataset.action;if(a==='login'){e.preventDefault();e.stopImmediatePropagation();state.loggedIn=true;state.role='学员端';state.page='home';render();return}if(a==='logout'){e.preventDefault();e.stopImmediatePropagation();clearInterval(timer);state.recording=false;state.report=false;state.feature=null;state.loggedIn=false;render();return}if(a==='open-search'){e.preventDefault();e.stopImmediatePropagation();openSearch();return}if(a==='close-search'){e.preventDefault();e.stopImmediatePropagation();state.page='home';state.searchQuery='';render();return}if(a==='clear-search'){e.preventDefault();e.stopImmediatePropagation();state.searchQuery='';const input=view.querySelector('[data-search-input]');if(input){input.value='';input.focus()}const clear=view.querySelector('.search-clear');if(clear)clear.style.visibility='hidden';updateSearchContent();return}if(a==='search-open-result'){e.preventDefault();e.stopImmediatePropagation();openSearchResult(t.dataset.searchTarget);return}if(a==='toast'){e.preventDefault();e.stopImmediatePropagation();openFeature(t.dataset.message||'功能详情');return}if(a==='feature-complete'){e.preventDefault();e.stopImmediatePropagation();state.featureDone=true;render();return}if(a==='close-feature'){e.preventDefault();e.stopImmediatePropagation();state.page=state.featureBack||'home';state.report=state.featureReturnReport;state.feature=null;state.featureDone=false;state.featureReturnReport=false;render();return}},true);
    let timer;function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
    function sheet(title,body,button='知道了'){document.querySelector('#sheetCard').innerHTML=`<h2>${title}</h2><p>${body}</p><button class="primary wide" data-action="close-sheet">${button}</button>`;document.querySelector('#sheet').classList.add('show')}
    function updateScore(side){state.score[side]++;state.server=state.score[side]%2===0?1-state.server:state.server;render()}
    document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.page){state.page=t.dataset.page;state.report=false;render();return}if(t.dataset.tab){state[t.dataset.tabKey]=t.dataset.tab;render();return}if(t.dataset.growth){state.growthMetric=t.dataset.growth;render();return}if(t.dataset.role){state.role=t.dataset.role;render();return}const a=t.dataset.action;if(!a)return;if(a==='start-training'||a==='go-train'){state.page='train';state.trainTab='训练';render()}if(a==='go-growth'){state.page='growth';render()}if(a==='go-event'){state.page='event';render()}if(a==='start-record'){state.recording=true;state.seconds=0;clearInterval(timer);timer=setInterval(()=>{state.seconds++;const label=document.querySelector('[data-record-elapsed]');if(label)label.textContent='采集中 · '+String(Math.floor(state.seconds/60)).padStart(2,'0')+':'+String(state.seconds%60).padStart(2,'0')},1000);render()}if(a==='finish-training'){state.recording=false;clearInterval(timer);state.report=true;render()}if(a==='open-report'){state.page='train';state.report=true;render()}if(a==='close-report'){state.report=false;render()}if(a==='checkin'){sheet('签到成功','你已完成签到。请在开赛前前往 3 号台，现场 LED 大屏将同步显示你的比赛信息。','前往比赛中心')}if(a==='enter-match'){state.page='match';render()}if(a==='exit-match'){state.page='event';render()}if(a==='point'){updateScore(Number(t.dataset.side))}if(a==='undo'){const s=state.score[0]>state.score[1]?0:1;if(state.score[s]>0)state.score[s]--;render()}if(a==='finish-match'){state.sets=[2,1];sheet('AI 战报已生成','你在关键分阶段保持了稳定节奏。反手位失分仍值得在下一周训练中重点关注。','查看成长档案')}if(a==='rules'){sheet('计分说明','无线按钮支持拍 1 下加分、快速连拍 2 下减分、长按切换发球权。网页原型中可通过 +1 和撤销按钮体验计分状态变化。')}if(a==='notice'){sheet('消息','你有一份新的训练建议：本周完成 3 次反手稳定性练习。')}if(a==='toast'){toast(t.dataset.message||'操作成功')}if(a==='close-sheet'){document.querySelector('#sheet').classList.remove('show')}});
    document.addEventListener('input',e=>{if(!e.target.matches('[data-search-input]'))return;state.searchQuery=e.target.value;const clear=view.querySelector('.search-clear');if(clear)clear.style.visibility=state.searchQuery?'visible':'hidden';updateSearchContent()});
    document.querySelector('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')e.currentTarget.classList.remove('show')});render();
  </script>
</body>
</html>
